<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solo Gig Chart Maker</title>
  <style>
    :root {
      --bg: #121214;
      --panel: #1e1e24;
      --text: #e4e4e7;
      --accent: #f59e0b;
      --border: #3f3f46;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }

    /* App Layout */
    .app-container { display: flex; height: 100vh; }
    
    /* Sidebar Manager */
    .sidebar { width: 260px; background: #18181b; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; }
    .sidebar h2 { font-size: 1.1rem; margin-bottom: 12px; color: #a1a1aa; text-transform: uppercase; letter-spacing: 1px; }
    .song-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .song-item { padding: 10px; background: var(--panel); border: 1px solid transparent; border-radius: 6px; cursor: pointer; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
    .song-item.active { border-color: var(--accent); font-weight: bold; }
    .delete-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0 4px; }

    /* Main Workspace */
    .workspace { flex: 1; display: flex; flex-direction: column; }
    .toolbar { height: 50px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .btn-group { display: flex; gap: 8px; align-items: center; }
    button { background: #27272a; color: #fff; border: 1px solid var(--border); padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
    button:hover { background: #3f3f46; }
    button.primary { background: var(--accent); color: #000; border: none; font-weight: bold; }
    button.primary:hover { background: #d97706; }

    .editor-container { flex: 1; display: flex; overflow: hidden; }
    textarea { width: 45%; background: #141416; color: #f4f4f5; border: none; border-right: 1px solid var(--border); padding: 20px; font-family: 'Courier New', Courier, monospace; font-size: 0.95rem; resize: none; outline: none; line-height: 1.5; }

    /* Sheet Preview Window */
    .preview-window { flex: 1; background: #27272a; padding: 20px; overflow-y: auto; display: flex; justify-content: center; }
    .paper { background: #ffffff; color: #000000; width: 8.5in; min-height: 11in; padding: 0.6in; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; flex-direction: column; justify-content: flex-start; }

    /* Rendered Chart Styling */
    .sheet-header { border-bottom: 2px solid #000; padding-bottom: 8px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: flex-end; }
    .sheet-title { font-size: 20pt; font-weight: 800; text-transform: uppercase; line-height: 1; }
    .sheet-meta { font-size: 10pt; text-align: right; font-weight: 600; color: #444; }
    
    .cue-box { background: #f3f4f6; border-left: 4px solid #000; padding: 6px 10px; font-size: 9.5pt; font-weight: 600; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 0.5px; }

    .sheet-body { display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .song-line { display: flex; flex-wrap: wrap; row-gap: 1.2em; column-gap: 0; line-height: 1; margin-bottom: 4px; }
    .chord-pair { display: inline-flex; flex-direction: column; justify-content: flex-end; position: relative; padding-right: 0.25em; }
    .chord-mark { font-weight: 800; font-size: 11pt; color: #b45309; height: 1.1em; line-height: 1.1; font-family: monospace; }
    .lyric-text { font-size: 11pt; font-weight: 500; color: #111827; white-space: pre; line-height: 1; }

    /* PDF Print Rule Override */
    @media print {
      body { background: white; color: black; height: auto; overflow: visible; }
      .sidebar, .toolbar, textarea { display: none !important; }
      .app-container, .workspace, .editor-container, .preview-window { display: block !important; padding: 0 !important; background: white !important; }
      .paper { width: 100% !important; min-height: 0 !important; box-shadow: none !important; padding: 0 !important; page-break-after: always; }
      @page { size: letter; margin: 0.5in; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>Setlist (15 Songs)</h2>
      <div class="song-list" id="songList"></div>
      <button onclick="createNewSong()" style="margin-top: 10px;">+ New Song</button>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
      <div class="toolbar">
        <div class="btn-group">
          <span>Transpose:</span>
          <button onclick="transposeCurrent(-1)">-1 Semitone</button>
          <button onclick="transposeCurrent(1)">+1 Semitone</button>
        </div>
        <div class="btn-group">
          <button class="primary" onclick="window.print()">Export / Print PDF</button>
        </div>
      </div>

      <div class="editor-container">
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="preview-window">
          <div class="paper" id="paper"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const flatMap = { "Db":"C#", "Eb":"D#", "Gb":"F#", "Ab":"G#", "Bb":"A#" };

    let setlist = JSON.parse(localStorage.getItem('bass_vi_setlist')) || [
      {
        id: "1",
        title: "Sample Chart",
        content: `{title: Wayfaring Stranger}\n{key: Am}\n{cue: Bass VI: Capo 2 | Octave pedal ON for chorus looper}\n\n[Am]I am a poor [Am]wayfaring stranger\nWhile traveling [Dm]through this world of [Am]woe\nYet there's no [Am]sickness, toil, nor danger\nIn that bright [Dm]land to which I [Am]go\n\nI'm going [F]there to see my [C]father\nI'm going [F]there no more to [E7]roam\nI'm only [Am]going over Jordan\nI'm only [Dm]going [Em]over [Am]home`
      }
    ];

    let currentSongId = setlist[0].id;

    const editor = document.getElementById('editor');
    const paper = document.getElementById('paper');
    const songListEl = document.getElementById('songList');

    function save() {
      localStorage.setItem('bass_vi_setlist', JSON.stringify(setlist));
    }

    function renderSidebar() {
      songListEl.innerHTML = '';
      setlist.forEach(song => {
        const item = document.createElement('div');
        item.className = `song-item ${song.id === currentSongId ? 'active' : ''}`;
        
        // Extract title from directives or fall back
        const titleMatch = song.content.match(/\{title:\s*(.*?)\}/i);
        const displayTitle = titleMatch ? titleMatch[1] : (song.title || "Untitled");

        item.innerHTML = `
          <span onclick="selectSong('${song.id}')" style="flex:1;">${displayTitle}</span>
          <button class="delete-btn" onclick="deleteSong('${song.id}')">&times;</button>
        `;
        songListEl.appendChild(item);
      });
    }

    function selectSong(id) {
      currentSongId = id;
      const song = setlist.find(s => s.id === id);
      editor.value = song ? song.content : '';
      renderSidebar();
      renderSheet();
    }

    function createNewSong() {
      const newId = Date.now().toString();
      setlist.push({
        id: newId,
        title: "New Song",
        content: `{title: New Song}\n{key: E}\n{cue: Bass VI Notes: Standard tuning}\n\n[E]Type your lyrics and [A]chords here.`
      });
      selectSong(newId);
      save();
    }

    function deleteSong(id) {
      if (setlist.length <= 1) return alert("You need at least one song in your setlist.");
      setlist = setlist.filter(s => s.id !== id);
      if (currentSongId === id) currentSongId = setlist[0].id;
      save();
      selectSong(currentSongId);
    }

    // Chord parsing engine
    function parseLine(line) {
      const pairs = [];
      const regex = /\[(.*?)\]|([^\[]+)/g;
      let match;
      let currentChord = "";

      while ((match = regex.exec(line)) !== null) {
        if (match[1] !== undefined) {
          currentChord = match[1];
        } else if (match[2] !== undefined) {
          pairs.push({ chord: currentChord, text: match[2] });
          currentChord = "";
        }
      }
      if (currentChord !== "") {
        pairs.push({ chord: currentChord, text: " " });
      }

      return pairs;
    }

    function renderSheet() {
      const text = editor.value;
      const lines = text.split('\n');

      let title = "UNTITLED SONG";
      let key = "";
      let cue = "";
      let bodyHtml = "";

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
          const content = trimmed.slice(1, -1);
          const [keyName, ...valParts] = content.split(':');
          const value = valParts.join(':').trim();

          if (keyName.toLowerCase() === 'title') title = value;
          if (keyName.toLowerCase() === 'key') key = value;
          if (keyName.toLowerCase() === 'cue') cue = value;
        } else if (trimmed === '') {
          bodyHtml += `<div style="height: 0.8em;"></div>`;
        } else {
          const pairs = parseLine(line);
          let lineHtml = `<div class="song-line">`;
          pairs.forEach(p => {
            lineHtml += `
              <div class="chord-pair">
                <div class="chord-mark">${p.chord || ''}</div>
                <div class="lyric-text">${p.text}</div>
              </div>`;
          });
          lineHtml += `</div>`;
          bodyHtml += lineHtml;
        }
      });

      paper.innerHTML = `
        <div class="sheet-header">
          <div class="sheet-title">${title}</div>
          <div class="sheet-meta">${key ? 'KEY: ' + key : ''}</div>
        </div>
        ${cue ? `<div class="cue-box">⚡ ${cue}</div>` : ''}
        <div class="sheet-body">${bodyHtml}</div>
      `;
    }

    // Transposition logic
    function shiftChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let normalized = flatMap[match] || match;
        let idx = scale.indexOf(normalized);
        if (idx === -1) return match;
        let newIdx = (idx + semitones + 12) % 12;
        return scale[newIdx];
      });
    }

    function transposeCurrent(semitones) {
      let text = editor.value;
      text = text.replace(/\[(.*?)\]/g, (_, chord) => `[${shiftChord(chord, semitones)}]`);
      text = text.replace(/(\{key:\s*)(.*?)\}/gi, (_, prefix, key) => `${prefix}${shiftChord(key, semitones)}`);
      
      editor.value = text;
      const current = setlist.find(s => s.id === currentSongId);
      if (current) current.content = text;
      save();
      renderSheet();
    }

    // Realtime listeners
    editor.addEventListener('input', () => {
      const current = setlist.find(s => s.id === currentSongId);
      if (current) {
        current.content = editor.value;
        save();
      }
      renderSidebar();
      renderSheet();
    });

    // Init App
    renderSidebar();
    selectSong(currentSongId);
  </script>
</body>
</html>

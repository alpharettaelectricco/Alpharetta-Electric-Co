<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpharetta Electric Co. | Chart Maker</title>
  
  <!-- PDF & Zip CDN Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    :root {
      --bg: #18181a;
      --panel: #222225;
      --panel-border: #333338;
      --kraft: #d4a373;
      --kraft-light: #f4ece1;
      --text-muted: #a1a1aa;
      --accent: #dda15e;
      --ink: #1c1917;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: var(--bg); 
      color: #e4e4e7; 
      height: 100vh; 
      overflow: hidden; 
    }

    .app-container { display: flex; height: 100vh; }
    
    /* Sidebar */
    .sidebar { 
      width: 280px; 
      background: #121214; 
      border-right: 1px solid var(--panel-border); 
      display: flex; 
      flex-direction: column; 
      padding: 20px; 
    }
    
    .brand-header {
      border-bottom: 2px solid var(--kraft);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .brand-header h1 {
      font-family: Georgia, serif;
      font-size: 1.1rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #fff;
    }

    .brand-header span {
      font-size: 0.75rem;
      color: var(--kraft);
      text-transform: uppercase;
      letter-spacing: 2px;
      display: block;
      margin-top: 2px;
    }

    .sidebar h2 { 
      font-size: 0.8rem; 
      margin-bottom: 10px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      letter-spacing: 1px; 
    }

    .song-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    
    .song-item { 
      padding: 12px; 
      background: var(--panel); 
      border: 1px solid var(--panel-border); 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.9rem; 
      display: flex; 
      justify-content: space-between; 
      align-items: center;
      transition: all 0.15s ease;
    }

    .song-item:hover { border-color: var(--kraft); }

    .song-item.active { 
      border-color: var(--kraft); 
      background: #2a2a2e;
      font-weight: 600; 
      color: #fff;
    }

    .delete-btn { color: #ef4444; background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0 4px; opacity: 0.6; }
    .delete-btn:hover { opacity: 1; }

    /* Workspace */
    .workspace { flex: 1; display: flex; flex-direction: column; }
    
    .toolbar { 
      height: 56px; 
      background: var(--panel); 
      border-bottom: 1px solid var(--panel-border); 
      display: flex; 
      align-items: center; 
      justify-content: space-between; 
      padding: 0 24px; 
    }

    .btn-group { display: flex; gap: 8px; align-items: center; font-size: 0.85rem; color: var(--text-muted); }
    
    button { 
      background: #2a2a2e; 
      color: #fff; 
      border: 1px solid var(--panel-border); 
      padding: 8px 12px; 
      border-radius: 4px; 
      cursor: pointer; 
      font-size: 0.85rem; 
      font-weight: 500; 
      transition: background 0.15s ease;
    }

    button:hover { background: #3f3f46; }

    button.primary { 
      background: var(--kraft); 
      color: var(--ink); 
      border: none; 
      font-weight: 700; 
      letter-spacing: 0.5px;
    }

    button.primary:hover { background: #c69263; }

    .editor-container { flex: 1; display: flex; overflow: hidden; }
    
    textarea { 
      width: 45%; 
      background: #141416; 
      color: #f4f4f5; 
      border: none; 
      border-right: 1px solid var(--panel-border); 
      padding: 24px; 
      font-family: 'Courier New', Courier, monospace; 
      font-size: 0.95rem; 
      resize: none; 
      outline: none; 
      line-height: 1.6; 
    }

    /* Preview Window */
    .preview-window { 
      flex: 1; 
      background: #0f0f10; 
      padding: 30px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .paper { 
      background: #ffffff; 
      color: var(--ink); 
      width: 8.5in; 
      height: fit-content; 
      min-height: 11in; 
      padding: 0.6in; 
      box-shadow: 0 12px 35px rgba(0,0,0,0.6); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      flex-direction: column; 
      page-break-after: always;
    }

    /* Chart Elements */
    .sheet-header { 
      border-bottom: 2px solid var(--ink); 
      padding-bottom: 8px; 
      margin-bottom: 16px; 
      display: flex; 
      justify-content: space-between; 
      align-items: flex-end; 
    }

    .sheet-title { 
      font-family: Georgia, serif; 
      font-size: 22pt; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.5px;
      line-height: 1; 
    }

    .sheet-meta { font-size: 10pt; text-align: right; font-weight: 700; color: #444; letter-spacing: 1px; }
    
    .cue-box { 
      background: var(--kraft-light); 
      border-left: 4px solid var(--kraft); 
      color: #432818;
      padding: 8px 12px; 
      font-size: 9.5pt; 
      font-weight: 700; 
      margin-bottom: 16px; 
      text-transform: uppercase; 
      letter-spacing: 0.5px; 
    }

    .sheet-body { display: flex; flex-direction: column; gap: 12px; flex: 1; }
    .song-line { display: flex; flex-wrap: wrap; row-gap: 1.2em; column-gap: 0; line-height: 1; margin-bottom: 4px; }
    .chord-pair { display: inline-flex; flex-direction: column; justify-content: flex-end; position: relative; padding-right: 0.25em; }
    .chord-mark { font-weight: 800; font-size: 11pt; color: #b45309; height: 1.1em; line-height: 1.1; font-family: monospace; }
    .lyric-text { font-size: 11pt; font-weight: 500; color: #111827; white-space: pre; line-height: 1; }

    /* Table of Contents Formatting */
    .toc-container { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }
    .toc-row { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dotted #ccc; padding-bottom: 6px; font-size: 12pt; }
    .toc-title { font-weight: 600; color: var(--ink); }
    .toc-meta { font-weight: 700; color: #b45309; font-family: monospace; font-size: 11pt; }

    /* Print Override */
    @media print {
      body { background: white; color: black; height: auto; overflow: visible; }
      .sidebar, .toolbar, textarea { display: none !important; }
      .app-container, .workspace, .editor-container, .preview-window { display: block !important; padding: 0 !important; background: white !important; }
      .paper { 
        width: 100% !important; 
        min-height: 0 !important; 
        box-shadow: none !important; 
        padding: 0 !important; 
        page-break-after: always !important; 
        break-after: page !important;
      }
      @page { size: letter; margin: 0.5in; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="sidebar">
      <div class="brand-header">
        <h1>Alpharetta Electric Co.</h1>
        <span>Chart Engine</span>
      </div>

      <h2 id="sidebar-header">Setlist</h2>
      <div class="song-list" id="songList"></div>
      <button onclick="createNewSong()" style="margin-top: 12px;">+ New Song</button>
    </div>

    <div class="workspace">
      <div class="toolbar">
        <div class="btn-group">
          <span>Transpose Key:</span>
          <button onclick="transposeCurrent(-1)">-1 Semitone</button>
          <button onclick="transposeCurrent(1)">+1 Semitone</button>
        </div>
        <div class="btn-group">
          <button onclick="exportBackup()">Export Backup</button>
          <button onclick="triggerImport()">Import Backup</button>
          <input type="file" id="importInput" accept=".txt,.json" style="display:none;" onchange="importBackup(event)">
          <button onclick="printCurrentSong()">Print Song</button>
          <button onclick="printAllSongs()">Batch Export All (PDF)</button>
          <button class="primary" onclick="downloadPdfZip()">Download Folder (.zip)</button>
        </div>
      </div>

      <div class="editor-container">
        <textarea id="editor" spellcheck="false"></textarea>
        <div class="preview-window" id="previewWindow">
          <!-- Renders active song or compiled setlist -->
        </div>
      </div>
    </div>
  </div>

  <script>
    const scale = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    const flatMap = { "Db":"C#", "Eb":"D#", "Gb":"F#", "Ab":"G#", "Bb":"A#" };

    const defaultGuideSong = {
      id: "1",
      title: "Chart Maker Guide",
      content: `{title: How To Use Chart Maker}\n{key: G}\n{cue: Performance Cues: Add structural notes, Capo positions, or pedal triggers}\n\n[G]Place chords in brackets inline with your [C]lyrics.\nThey automatically render [D]directly above the word.\n\n{cue: Key Transposition}\nUse the [-1] and [+1] buttons in the top toolbar.\nIt shifts every [Em]chord and updates the [C]header key live.\n\n{cue: Saving & Backups}\nAll your [G]charts save automatically in your browser.\nUse Export/Import Backup to save or [D]sync setlists across devices.\n\n{cue: PDF & Print Options}\nPrint Song prints just this [C]chart.\nBatch Export prints all [D]songs with an automatic Table of Contents cover page.\nDownload Folder downloads a [.zip] of individual PDFs.`
    };

    let setlist = JSON.parse(localStorage.getItem('aec_setlist')) || [ defaultGuideSong ];

    let currentSongId = setlist[0].id;

    const editor = document.getElementById('editor');
    const previewWindow = document.getElementById('previewWindow');
    const songListEl = document.getElementById('songList');
    const sidebarHeader = document.getElementById('sidebar-header');

    function save() {
      localStorage.setItem('aec_setlist', JSON.stringify(setlist));
    }

    function renderSidebar() {
      sidebarHeader.innerText = `Setlist (${setlist.length} Songs)`;
      songListEl.innerHTML = '';
      setlist.forEach(song => {
        const item = document.createElement('div');
        item.className = `song-item ${song.id === currentSongId ? 'active' : ''}`;
        
        const titleMatch = song.content.match(/\{title:\s*(.*?)\}/i);
        const displayTitle = titleMatch ? titleMatch[1] : (song.title || "Untitled");

        item.innerHTML = `
          <span onclick="selectSong('${song.id}')" style="flex:1;">${displayTitle}</span>
          <button class="delete-btn" onclick="deleteSong('${song.id}')">&times;</button>
        `;
        songListEl.appendChild(item);
      });
    }

    function selectSong(id) {
      currentSongId = id;
      const song = setlist.find(s => s.id === id);
      editor.value = song ? song.content : '';
      renderSidebar();
      renderSheet();
    }

    function createNewSong() {
      const newId = Date.now().toString();
      setlist.push({
        id: newId,
        title: "New Song",
        content: `{title: New Song}\n{key: G}\n{cue: Performance Cues: Key, tempo, or arrangement notes}\n\n[G]Type lyrics and [C]chords here.`
      });
      selectSong(newId);
      save();
    }

    function deleteSong(id) {
      setlist = setlist.filter(s => s.id !== id);
      
      if (setlist.length === 0) {
        setlist = [ defaultGuideSong ];
      }
      
      if (!setlist.find(s => s.id === currentSongId)) {
        currentSongId = setlist[0].id;
      }

      save();
      selectSong(currentSongId);
    }

    function parseLine(line) {
      const pairs = [];
      const regex = /\[(.*?)\]|([^\[]+)/g;
      let match;
      let currentChord = "";

      while ((match = regex.exec(line)) !== null) {
        if (match[1] !== undefined) {
          currentChord = match[1];
        } else if (match[2] !== undefined) {
          pairs.push({ chord: currentChord, text: match[2] });
          currentChord = "";
        }
      }
      if (currentChord !== "") pairs.push({ chord: currentChord, text: " " });
      return pairs;
    }

    function generateSongHtml(content) {
      const lines = content.split('\n');
      let title = "UNTITLED SONG";
      let key = "";
      let bodyHtml = "";

      lines.forEach(line => {
        const trimmed = line.trim();
        if (trimmed.startsWith('{') && trimmed.endsWith('}')) {
          const inner = trimmed.slice(1, -1);
          const [keyName, ...valParts] = inner.split(':');
          const value = valParts.join(':').trim();

          if (keyName.toLowerCase() === 'title') {
            title = value;
          } else if (keyName.toLowerCase() === 'key') {
            key = value;
          } else if (keyName.toLowerCase() === 'cue') {
            bodyHtml += `<div class="cue-box">⚡ ${value}</div>`;
          }
        } else if (trimmed === '') {
          bodyHtml += `<div style="height: 0.8em;"></div>`;
        } else {
          const pairs = parseLine(line);
          let lineHtml = `<div class="song-line">`;
          pairs.forEach(p => {
            lineHtml += `
              <div class="chord-pair">
                <div class="chord-mark">${p.chord || ''}</div>
                <div class="lyric-text">${p.text}</div>
              </div>`;
          });
          lineHtml += `</div>`;
          bodyHtml += lineHtml;
        }
      });

      return `
        <div class="paper">
          <div class="sheet-header">
            <div class="sheet-title">${title}</div>
            <div class="sheet-meta">${key ? 'KEY: ' + key : ''}</div>
          </div>
          <div class="sheet-body">${bodyHtml}</div>
        </div>
      `;
    }

    function generateTocHtml() {
      let rowsHtml = "";
      setlist.forEach((song, idx) => {
        const titleMatch = song.content.match(/\{title:\s*(.*?)\}/i);
        const keyMatch = song.content.match(/\{key:\s*(.*?)\}/i);
        
        const title = titleMatch ? titleMatch[1] : (song.title || "Untitled");
        const key = keyMatch ? keyMatch[1] : "";

        rowsHtml += `
          <div class="toc-row">
            <span class="toc-title">${idx + 1}. ${title}</span>
            <span class="toc-meta">${key ? 'KEY: ' + key : ''}</span>
          </div>
        `;
      });

      return `
        <div class="paper">
          <div class="sheet-header">
            <div class="sheet-title">Setlist Index</div>
            <div class="sheet-meta">${setlist.length} SONGS</div>
          </div>
          <div class="sheet-body">
            <div class="toc-container">
              ${rowsHtml}
            </div>
          </div>
        </div>
      `;
    }

    function renderSheet() {
      previewWindow.innerHTML = generateSongHtml(editor.value);
    }

    function printCurrentSong() {
      renderSheet();
      window.print();
    }

    function printAllSongs() {
      // Prepend Table of Contents page followed by all songs
      const tocHtml = generateTocHtml();
      const songsHtml = setlist.map(song => generateSongHtml(song.content)).join('');
      
      previewWindow.innerHTML = tocHtml + songsHtml;
      
      setTimeout(() => {
        window.print();
        renderSheet();
      }, 100);
    }

    async function downloadPdfZip() {
      const zip = new JSZip();
      const folder = zip.folder("AEC_Setlist_PDFs");
      
      for (let song of setlist) {
        previewWindow.innerHTML = generateSongHtml(song.content);
        const element = previewWindow.querySelector('.paper');
        
        const titleMatch = song.content.match(/\{title:\s*(.*?)\}/i);
        const safeTitle = (titleMatch ? titleMatch[1] : song.title || "Untitled")
          .replace(/[^a-z0-9]/gi, '_').toLowerCase();

        const opt = {
          margin:       0.5,
          filename:     `${safeTitle}.pdf`,
          image:        { type: 'jpeg', quality: 0.98 },
          html2canvas:  { scale: 2 },
          jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
        };

        const pdfBlob = await html2pdf().set(opt).from(element).output('blob');
        folder.file(`${safeTitle}.pdf`, pdfBlob);
      }

      renderSheet();

      const content = await zip.generateAsync({ type: "blob" });
      const downloadAnchor = document.createElement('a');
      downloadAnchor.href = URL.createObjectURL(content);
      downloadAnchor.download = "AEC_Setlist_PDFs.zip";
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function shiftChord(chord, semitones) {
      return chord.replace(/[A-G][#b]?/g, (match) => {
        let normalized = flatMap[match] || match;
        let idx = scale.indexOf(normalized);
        if (idx === -1) return match;
        let newIdx = (idx + semitones + 12) % 12;
        return scale[newIdx];
      });
    }

    function transposeCurrent(semitones) {
      let text = editor.value;
      text = text.replace(/\[(.*?)\]/g, (_, chord) => `[${shiftChord(chord, semitones)}]`);
      text = text.replace(/(\{key:\s*)(.*?)\}/gi, (_, prefix, key) => `${prefix}${shiftChord(key, semitones)}`);
      
      editor.value = text;
      const current = setlist.find(s => s.id === currentSongId);
      if (current) current.content = text;
      save();
      renderSheet();
    }

    function exportBackup() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(setlist, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "aec_setlist_backup.txt");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function triggerImport() {
      document.getElementById('importInput').click();
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const importedSetlist = JSON.parse(e.target.result);
          if (Array.isArray(importedSetlist) && importedSetlist.length > 0) {
            setlist = importedSetlist;
            currentSongId = setlist[0].id;
            save();
            selectSong(currentSongId);
            alert("Setlist imported successfully!");
          } else {
            alert("Invalid setlist file format.");
          }
        } catch (err) {
          alert("Could not read backup file.");
        }
      };
      reader.readAsText(file);
    }

    editor.addEventListener('input', () => {
      const current = setlist.find(s => s.id === currentSongId);
      if (current) {
        current.content = editor.value;
        save();
      }
      renderSidebar();
      renderSheet();
    });

    renderSidebar();
    selectSong(currentSongId);
  </script>
</body>
</html>
